[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-genomics-ds"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring a browser",
]

[tool.ruff]
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["notebooks/"]

[tool.black]
line-length = 100
